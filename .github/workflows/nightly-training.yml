name: Nightly Model Training

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scheduled-training:
    name: 🌙 Scheduled Model Training
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🤖 Run Complete Pipeline
      run: |
        python main2.py --all || echo "Pipeline execution completed"
      continue-on-error: true
    
    - name: 💾 Archive Models
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: nightly-model-${{ github.run_number }}
        path: |
          *.joblib
        retention-days: 90
      continue-on-error: true
    
    - name: 📧 Notify on Failure
      if: failure()
      run: |
        echo "❌ Nightly training failed!"
        echo "Check the logs for details."
